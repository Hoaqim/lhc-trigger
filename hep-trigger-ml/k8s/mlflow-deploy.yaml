apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata: { labels: { app: mlflow } }
    spec:
      serviceAccountName: training-sa          
      containers:
        - name: mlflow
          image: ecr_repos/hep-mlflow:latest
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: mlflow }
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]