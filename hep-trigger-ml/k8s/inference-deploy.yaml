apiVersion: apps/v1
kind: Deployment
metadata: { name: inference }
spec:
  replicas: 1
  selector: { matchLabels: { app: inference } }
  template:
    metadata: { labels: { app: inference } }
    spec:
      serviceAccountName: training-sa         
      containers:
        - name: inference
          image: ecr_repos/hep-streaming:latest
          command: ["python", "inference_consumer.py"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: KAFKA_BROKERS,       value: "msk-brokers" }
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: MODEL_URI,           value: "models:/higgs-classifier/1" }
---
apiVersion: v1
kind: Service
metadata: { name: inference }
spec:
  selector: { app: inference }
  ports: [{ port: 8000, targetPort: 8000 }]